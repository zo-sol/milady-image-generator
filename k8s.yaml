apiVersion: apps/v1
kind: Deployment
metadata:
  name: milady-pfp
  namespace: iqlabs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milady-pfp
  template:
    metadata:
      labels:
        app: milady-pfp
    spec:
      containers:
        - name: milady-pfp
          image: iqlabs/milady-pfp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: milady-pfp
  namespace: iqlabs
spec:
  selector:
    app: milady-pfp
  ports:
    - port: 3003
      targetPort: 3003
